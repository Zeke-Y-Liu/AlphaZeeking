# 研究假设注册表（M5，实施计划 §8 任务 8.1/R3：无来源不激活）
# activate 门禁强制因子 hypothesis_id 在本表且 statement 非空；
# 季度巡检「假设仍成立吗」复查步自动带出 statement 生成待答项。
# status: open（待验证）| confirmed（巡检/证据支持）| refuted（被证伪，因子应走降级）
H-VAL-001:
  statement: >-
    价值溢价：低相对估值（低 PE/PB/PS、高股息）股票组合在中长期获得正超额收益，
    且效应在牛熊环境中方向一致（局部失效可解释）。
  status: open
  created_at: "2026-10-12"
H-QUA-001:
  statement: >-
    质量溢价：高盈利质量（高 ROE/毛利率/现金流含金量、低应计/低杠杆）股票组合
    在中长期获得正超额收益。
  status: open
  created_at: "2026-10-12"
H-GRO-001:
  statement: >-
    成长溢价：营收/盈利高增长（同比增速、3 年 CAGR、增长稳定性、盈利超预期 SUE）
    股票组合在中长期获得正超额收益；增速波动大者（低稳定性）预期负向。
  status: open
  created_at: "2026-10-12"
H-MOM-001:
  statement: >-
    动量效应：中期（6–12 月剔除近 1 月）价格动量正向；行业相对动量在剔除行业
    公共成分后仍保留选股信息（本库截面窄，行业调整退化口径见因子 notes）。
  status: open
  created_at: "2026-10-12"
H-LOW-001:
  statement: >-
    低波异象与红利溢价：低波动（低 52 周收益波动、低 beta）股票组合中长期风险
    调整后占优（direction 取负）；持续分红记录（分红连击）代表盈利与治理质量，
    长期正向。
  status: open
  created_at: "2026-10-12"
H-E3-001:
  statement: >-
    E3 策略克隆：用户标记「满意」的历史交易在既有注册因子上呈现稳定共性特征
    （方向秩分位中位数 ≥ 阈值），该特征的截面 zscore 等权组合能复现其选股打法；
    克隆候选走同一检验流水线（③④⑤⑥）不豁免任何关卡——若仅为既有因子重组
    （⑤ 增量关共线），诚实落入替代通道而非独立注册。
  status: open
  created_at: "2026-10-12"
