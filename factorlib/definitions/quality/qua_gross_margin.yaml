# qua_gross_margin —— 毛利率（M2，实施计划 §5 首批 P0）
# 口径：margin（主营业务利润率 %，ytd）最新可得，LF 不做 TTM（比率类 ytd 平稳）
# 负毛利保留（方向 +1）；无财报无行
id: qua_gross_margin
name: 毛利率
family: quality
type: alpha
status: draft
version: 1.0.0
universe: [CN]
engine: sql
lookback_days: 0
depends: [dwd_financial_report]
direction: +1
hypothesis_id: null
transform: []
sql: |
  WITH b AS (
    SELECT DISTINCT dt, secid FROM dwd_daily_bar
    WHERE ($start_dt IS NULL OR dt >= CAST($start_dt AS DATE))
      AND ($end_dt IS NULL OR dt <= CAST($end_dt AS DATE))
  ),
  pit AS (
    SELECT b.dt, f.secid, f.period, f.announce_date, f.margin,
           row_number() OVER (PARTITION BY b.dt, f.secid
                              ORDER BY f.announce_date DESC, f.period DESC) AS rn
    FROM b JOIN dwd_financial_report f
      ON f.secid = b.secid AND f.announce_date <= b.dt
  )
  SELECT dt, secid,
         margin AS value,
         period AS used_period, announce_date AS used_announce
  FROM pit WHERE rn = 1
