# val_pe_ttm —— 市盈率 TTM（M1 首个端到端示例因子，实施计划 §4 产出物）
# 口径：close / TTM_EPS；TTM_EPS 由 eps_ytd 滚动（年报 = 全年 EPS；季报 = 本期 − 去年同期 + 去年年报）
# PIT：报告期以 announce_date <= dt 对齐（同一公告日多份报告取最新 period）；负值置空（M2 口径预对齐）
id: val_pe_ttm
name: 市盈率TTM
family: valuation
type: alpha
status: draft
version: 1.0.0
universe: [CN]
engine: sql
lookback_days: 0
depends: [dwd_daily_bar, dwd_financial_report]
direction: -1            # 低估值长期正超额 → 打分方向为负
hypothesis_id: null      # M1 允许空；M5 激活门禁将强制
transform: []            # PE 原值入档；截面变换由消费端按需链式
sql: |
  WITH b AS (
    SELECT dt, secid, close FROM dwd_daily_bar
    WHERE ($start_dt IS NULL OR dt >= CAST($start_dt AS DATE))
      AND ($end_dt IS NULL OR dt <= CAST($end_dt AS DATE))
  ),
  pit AS (
    SELECT b.dt, b.secid, b.close, f.period, f.announce_date, f.eps_ytd,
           row_number() OVER (PARTITION BY b.dt, b.secid
                              ORDER BY f.announce_date DESC, f.period DESC) AS rn
    FROM b JOIN dwd_financial_report f
      ON f.secid = b.secid AND f.announce_date <= b.dt
  ),
  p0 AS (
    SELECT dt, secid, close, period, announce_date, eps_ytd FROM pit WHERE rn = 1
  ),
  ttm AS (
    SELECT p0.dt, p0.secid, p0.close,
           p0.period AS used_period, p0.announce_date AS used_announce,
           CASE
             WHEN CAST(strftime(p0.period, '%m') AS INTEGER) = 12 THEN p0.eps_ytd
             ELSE p0.eps_ytd
                  - (SELECT f.eps_ytd FROM dwd_financial_report f
                     WHERE f.secid = p0.secid
                       AND f.period = CAST(p0.period AS DATE) - INTERVAL 1 YEAR)
                  + (SELECT f.eps_ytd FROM dwd_financial_report f
                     WHERE f.secid = p0.secid
                       AND f.period = make_date(CAST(strftime(p0.period, '%Y') AS INTEGER) - 1,
                                                12, 31))
           END AS ttm_eps
    FROM p0
  )
  SELECT dt, secid,
         CASE WHEN ttm_eps > 0 THEN close / ttm_eps END AS value,
         used_period, used_announce
  FROM ttm
