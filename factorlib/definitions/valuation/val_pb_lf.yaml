# val_pb_lf —— 市净率 LF（M2，实施计划 §5 首批 P0）
# 口径：close / bps（最新财报每股净资产，LF = last filing，非 TTM）；bps <= 0 置空
# PIT：report 以 announce_date <= dt 对齐（同一公告日多份报告取最新 period）
id: val_pb_lf
name: 市净率LF
family: valuation
type: alpha
status: draft
version: 1.0.0
universe: [CN]
engine: sql
lookback_days: 0
depends: [dwd_daily_bar, dwd_financial_report]
direction: -1            # 低估值长期正超额 → 打分方向为负
hypothesis_id: null
transform: []
sql: |
  WITH b AS (
    SELECT dt, secid, close FROM dwd_daily_bar
    WHERE ($start_dt IS NULL OR dt >= CAST($start_dt AS DATE))
      AND ($end_dt IS NULL OR dt <= CAST($end_dt AS DATE))
  ),
  pit AS (
    SELECT b.dt, b.secid, b.close, f.period, f.announce_date, f.bps,
           row_number() OVER (PARTITION BY b.dt, b.secid
                              ORDER BY f.announce_date DESC, f.period DESC) AS rn
    FROM b JOIN dwd_financial_report f
      ON f.secid = b.secid AND f.announce_date <= b.dt
  )
  SELECT dt, secid,
         CASE WHEN bps > 0 THEN close / bps END AS value,
         period AS used_period, announce_date AS used_announce
  FROM pit WHERE rn = 1
