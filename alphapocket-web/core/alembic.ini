# Alembic 配置（T2.1）。
# 注意：sqlalchemy.url 不在此写死，由 migrations/env.py 从
# app.core.config.settings.database_url 注入（见 §5.1 / §3.3）。
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
# 留空：运行期由 env.py 从 core 配置覆盖
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
