# M7 T-F2 估值族：P/S（TTM 营收），PIT 红线写在 SQL 内
id: val_ps_ttm
name: 市销率TTM
category: F2_fundamental
factor_type: alpha
engine: sql
direction: low            # 低 P/S 为超配（营收锚定价值，亏损公司仍可比）
universe: [CN]
inputs: [fl_daily_bar, fl_dws_financial_ttm, fl_market_cap]
lookback_days: 0
pit: true
version: 1.0.0
status: draft
description: |
  P/S_TTM = 总市值 / TTM 营收（TTM = 本期 YTD + 上年 FY − 上年同期 YTD，见 prepare）。
  - PIT：报告可用性以 announce_date <= 交易日（PIT 红线，篡改测试对象）；
  - LF/回退：TTM 累计口径下依赖缺失的报告期行为 NULL，显式过滤后截面回退最近可算报告期（QUALIFY）；
  - 市值：fl_market_cap 周频快照 ASOF JOIN（≤dt 最新点，滞后 ≤7 天，透明口径）；
  - 营收 ≤0（异常财报）P/S 无意义 → NULL 不落行；
  - 假设：H-0008（低 P/S 截面未来 1-6 月收益占优）。
formula: mktcap / TTM(revenue)
transform: []
neutralization: []
owner: factorlib
hypothesis_id: H-0008
sql: |
  WITH ps AS (
      SELECT d.dt, d.secid,
             c.mktcap_yi * 1e8 AS mktcap,
             t.period AS used_period, t.announce_date AS used_announce, t.ttm_rev
      FROM fl_daily_bar d
      ASOF JOIN fl_market_cap c ON c.secid = d.secid AND c.dt <= d.dt
      JOIN fl_dws_financial_ttm t
        ON t.secid = d.secid AND t.announce_date <= d.dt AND t.ttm_rev IS NOT NULL
      WHERE d.dt BETWEEN $start AND $end
  )
  SELECT dt, secid,
         CASE WHEN ttm_rev > 0 THEN mktcap / ttm_rev END AS value,
         used_period, used_announce
  FROM ps
  QUALIFY row_number() OVER (PARTITION BY dt, secid ORDER BY used_period DESC) = 1
