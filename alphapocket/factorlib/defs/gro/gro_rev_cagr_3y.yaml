# M7 T-F4 成长族：营收 TTM 3 年复合增长率，PIT 红线写在 SQL 内
id: gro_rev_cagr_3y
name: 营收TTM三年复合增长
category: F2_fundamental
factor_type: alpha
engine: sql
direction: high           # 高长期增长为超配（长期成长溢价，实证裁决）
universe: [CN]
inputs: [fl_daily_bar, fl_dws_financial_ttm]
lookback_days: 0
pit: true
version: 1.0.0
status: draft
description: |
  3 年 CAGR = (营收 TTM_t / 营收 TTM_{t-12季})^(1/3) − 1（12 报告期回看，多期复利推演，
  TTM 对齐复用 M1 阶梯）。
  - 基期或当期 TTM ≤0 → NULL 不落行（负数比率开立方无经济意义）；
  - PIT：当期与基期（−36 月）两链均以 announce_date <= 交易日；
  - 预热声明（min_periods 语义）：基期 TTM（−36 月）最早非空 = 2018Q1
    （2017 期 ttm 因缺 2016 年报而 NULL）→ 最早当期 = 2021Q1 报告期
    （2021-04 公告起）；T-F1 财报拉取起点生效锚在 2021-05 截面验证
    （注：契约原推导「财报 2017Q1 起 → cagr 2020Q1 起」未计入 TTM 累计口径的
    上上年依赖，据实修正——2017 期 ttm 全 NULL，非实现缺陷）；
  - 假设：H-0018（高长期营收增长截面未来 1-6 月收益占优——增长率水平与持续性
    的 A 股截面命题，门禁实证裁决）。
formula: (TTM(revenue) / TTM(revenue, -12Q))^(1/3) - 1
transform: []
neutralization: []
owner: factorlib
hypothesis_id: H-0018
sql: |
  WITH cur AS (
      SELECT d.dt, d.secid, t.ttm_rev,
             t.period AS used_period, t.announce_date AS used_announce
      FROM fl_daily_bar d
      JOIN fl_dws_financial_ttm t
        ON t.secid = d.secid AND t.announce_date <= d.dt AND t.ttm_rev IS NOT NULL
      WHERE d.dt BETWEEN $start AND $end
      QUALIFY row_number() OVER (PARTITION BY d.dt, d.secid ORDER BY t.period DESC) = 1
  )
  SELECT c.dt, c.secid,
         CASE WHEN b.ttm_rev > 0 AND c.ttm_rev > 0
              THEN power(c.ttm_rev / b.ttm_rev, 1.0 / 3) - 1 END AS value,
         c.used_period, c.used_announce
  FROM cur c
  JOIN fl_dws_financial_ttm b
    ON b.secid = c.secid
   AND date_diff('month', b.period, c.used_period) = 36
   AND b.announce_date <= c.dt
   AND b.ttm_rev IS NOT NULL
