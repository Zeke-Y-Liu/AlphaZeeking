# 低波动异象：252 日日收益样本标准差年化
id: low_vol_252d
name: 252日年化波动率
category: F1_technical
factor_type: alpha
engine: sql
direction: low
universe: [CN]
inputs: [fl_daily_bar]
lookback_days: 252
pit: true
version: 1.0.0
status: draft
description: |
  252 交易日日收益（close/lag(close,1)−1）样本标准差 × √252 年化。

  窗口守卫：ROW BETWEEN 251 PRECEDING 框架不满 252 行时 stddev_samp 仍会基于
  可用行输出 → 显式 count(ret) >= 252 才落行（契约「窗口不足 → None」，禁止
  用不足窗口的 std 冒充）。2017-01 拉取 → 2018-01 起有值。

  涨跌停日收益保留（真实波动，不做涨跌停剔除）；停牌日 fl_daily_bar 无行
  自然跳过（不插值、不前填）。direction=low（低波好，eval asc 语义）。
sql: |
  WITH r AS (
      SELECT secid, dt,
             close / lag(close, 1) OVER (PARTITION BY secid ORDER BY dt) - 1 AS ret
      FROM fl_daily_bar
  ),
  w AS (
      SELECT secid, dt, ret,
             count(ret) OVER w1 AS n,
             stddev_samp(ret) OVER w1 AS s
      FROM r
      WINDOW w1 AS (PARTITION BY secid ORDER BY dt
                    ROWS BETWEEN 251 PRECEDING AND CURRENT ROW)
  )
  SELECT secid, dt, s * sqrt(252) AS value,
         CAST(NULL AS DATE) AS used_period,
         CAST(NULL AS DATE) AS used_announce
  FROM w
  WHERE n >= 252 AND s IS NOT NULL AND dt BETWEEN $start AND $end
