# GitHub Pages 部署（workflow 模式）：构建 web 前端 → upload-pages-artifact → deploy-pages（2026-10-31）。
# configure-pages 的 enablement 在 Pages 未启用时会自动创建站点（build_type=workflow）。
# 页面为纯静态托管，无后端：登录需可达后端（浏览器 localStorage 设 ap.api-base）——
# `ap.api-base`（如 https://your-host/api）后刷新即可指向自建后端（见 README §GitHub Pages）。
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, trae/agent-LjfsH0]
    paths: ['alphapocket-web/web/**', '.github/workflows/gh-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: alphapocket-web/web/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile
        working-directory: alphapocket-web/web

      - name: Build（子路径 base）
        run: pnpm exec vite build --base=/AlphaZeeking/
        working-directory: alphapocket-web/web

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: alphapocket-web/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
