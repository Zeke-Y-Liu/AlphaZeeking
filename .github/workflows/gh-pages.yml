# GitHub Pages 部署（branch 模式）：构建 web 前端 → 推 gh-pages 分支（Pages source = gh-pages branch）。
# 不依赖 Pages site API（enablement 需 admin token 的硬限制）——首次启用请在网页
# Settings → Pages → Source 选 "Deploy from a branch" + 分支 gh-pages + 目录 /(root)。
# 页面为纯静态托管，无后端：登录需可达后端（浏览器 localStorage 设 ap.api-base）——
# 见 alphapocket-web/README.md §GitHub Pages。
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['alphapocket-web/web/**', '.github/workflows/gh-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: alphapocket-web/web/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile
        working-directory: alphapocket-web/web

      - name: Build（子路径 base）
        run: pnpm exec vite build --base=/AlphaZeeking/
        working-directory: alphapocket-web/web

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: alphapocket-web/web/dist
          publish_branch: gh-pages
          force_orphan: true
